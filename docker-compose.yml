services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: agri_report_app
    restart: unless-stopped
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/local.ini
    depends_on:
      - db
    networks:
      - agri-network

  nginx:
    image: nginx:alpine
    container_name: agri_report_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./backend:/var/www/backend
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - agri-network

  db:
    image: mysql:8.0
    container_name: agri_report_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-agri_report}
      MYSQL_USER: ${DB_USERNAME:-agri_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - agri-network

networks:
  agri-network:
    driver: bridge

volumes:
  dbdata:
